komari:
  endpoint: https://komari.example.com
  auto_discovery_key: ${KOMARI_AUTODISCOVERY_KEY}
  timeout: 15s

database:
  path: ./data/komari-bridge.db

http:
  # Keep this private or place it behind an authenticated reverse proxy.
  listen: 127.0.0.1:9090
  api_key: ${BRIDGE_API_KEY}

scheduler:
  # Komari marks an HTTP-reporting client offline after 35 seconds.
  interval: 20s

providers:
  proxmox:
    - id: site-a
      endpoint: https://pve.example.internal:8006
      token_id: komari-bridge@pve!monitor
      token_secret: ${PVE_SITE_A_TOKEN}
      group: Lab A
      insecure_skip_verify: false
      skip_stopped: true
      names:
        "node:pve-a": pve-a
        "qemu:100": nas-a
        "qemu:101": router-a
        "qemu:105": gpu-a
      resources:
        "qemu:100":
          os: NAS appliance
          # Use MemTotal - MemAvailable from a running Linux guest instead of
          # QEMU process memory observed by PVE.
          guest_memory: qga

  # Discovers containers through the Docker Engine API. Compose and Swarm
  # workloads are recognized from Docker's standard labels and receive stable
  # logical identities across container/task recreation.
  docker:
    - id: nas-a-docker
      # For a bridge running on the Docker host. Access to this socket is
      # effectively root-equivalent; prefer a tightly scoped socket proxy.
      endpoint: unix:///var/run/docker.sock
      group: Lab A
      # Safe default: only containers with label
      # komari.bridge.monitor=true are registered. Set true to include every
      # matching running container on this engine.
      include_all: false
      include_stopped: false
      attach_to:
        source_type: proxmox
        source_id: site-a
        external_id: qemu:100

    # Remote engines should use mutual TLS. Plain tcp/http endpoints are
    # rejected unless insecure_allow_http is explicitly enabled.
    # - id: remote-docker
    #   endpoint: https://docker.example.internal:2376
    #   tls_ca_file: /run/secrets/docker_ca.pem
    #   tls_cert_file: /run/secrets/docker_client.pem
    #   tls_key_file: /run/secrets/docker_client_key.pem

  # Optional fallback for systems where Komari Agent cannot be installed.
  # Do not use this as the default host collector.
  agentless_ssh:
    - id: gpu-a
      address: gpu-a.example.internal:22
      user: monitor
      private_key_path: /run/secrets/gpu_a_ssh_key
      host_key: SHA256:replace-with-the-real-host-key-fingerprint
      name: gpu-a
      group: Lab A
      enable_nvidia: true
      # Merge guest metrics into the PVE-discovered VM.
      attach_to:
        source_type: proxmox
        source_id: site-a
        external_id: qemu:105

  # Slurm is extension-only: it updates /api/v1/slurm and does not register a
  # second Komari host client. The official Agent should report host metrics.
  slurm:
    - id: gpu-a
      address: gpu-a.example.internal:22
      user: monitor
      private_key_path: /run/secrets/gpu_a_ssh_key
      host_key: SHA256:replace-with-the-real-host-key-fingerprint

  # Discovers WSL children without replacing Windows host metrics. Install the
  # official Agent on Windows when possible.
  windows_wsl:
    - id: workstation-a
      address: workstation-a.example.internal:22
      # This must be the Windows user that owns the WSL registrations.
      user: monitor
      private_key_path: /run/secrets/workstation_a_ssh_key
      host_key: SHA256:replace-with-the-real-host-key-fingerprint
      name: workstation-a
      group: Lab A
      wsl_names:
        Ubuntu: wsl-a
      attach_to:
        source_type: proxmox
        source_id: site-a
        external_id: qemu:107
